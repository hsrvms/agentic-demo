root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
pre_cmd = ["templ generate"]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go", "templ"]
exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules", "sql", ".git", ".devcontainer", ".pi", ".piv", "bruno"]
exclude_regex = ["_test\\.go", "_templ\\.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "1s"
delay = 200

[log]
time = false
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true

name: ${COMPOSE_PROJECT_NAME:-go-devcontainer}

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    init: true
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      PGDATABASE: app
      PGHOST: postgres
      PGPASSWORD: app
      PGPORT: "5432"
      PGUSER: app
      REDIS_URL: redis://redis:6379/0
      # S3-compatible object storage — the same vars select MinIO in dev and
      # Cloudflare R2 / AWS S3 in production.
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: platform
      S3_USE_SSL: "false"
    volumes:
      - ..:/workspace
      - type: bind
        source: ${HOME}/.pi
        target: /home/dev/.pi
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.ssh
        target: /home/dev/.ssh
        read_only: true
      - type: bind
        source: ${HOME}/.config/gh
        target: /home/dev/.config/gh
        read_only: true
        bind:
          create_host_path: false
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/build-cache
      - npm-cache:/home/dev/.npm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # pgvector is a drop-in PostgreSQL image and matches projects that use the vector extension.
  # For plain PostgreSQL, replace it with postgres:18.4-bookworm.
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  go-mod-cache:
  go-build-cache:
  npm-cache:
